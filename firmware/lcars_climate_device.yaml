# Everything the LCARS air con dial builds share: hardware, the knob, the Home Assistant
# climate link and the setup screens. The including file provides the device name, api,
# ota and wifi, and the substitutions listed in lcars_climate_ui.yaml plus
# climate_entity, power_on_mode and temp_range_from_ha.
#
# The climate entity is chosen at run time (the "Climate entity" text on the device page).
# Home Assistant only collects a device's state subscriptions when it connects, so they're
# made at boot for the saved entity, and changing it restarts the dial.

esphome:
  includes:
    - lcars_climate.h
    - lcars_setup.h
  on_boot:
    priority: -100
    then:
      # Before Wi-Fi is up, so Home Assistant sees these subscriptions when it connects
      - lambda: |-
          std::string e = id(climate_entity).state;
          e.erase(0, e.find_first_not_of(" \t"));
          e.erase(e.find_last_not_of(" \t") + 1);
          id(subscribed_entity) = e;
          id(subscriptions_made) = true;
          static const char *MODES[] = {"", "heat_cool", "auto", "heat", "cool"};
          id(on_mode) = MODES[id(power_on_mode).active_index().value_or(0)];
          if (e.empty()) return;
          using Cb = std::function<void(const std::string &)>;
          auto *api = api::global_api_server;
          api->subscribe_home_assistant_state(e, {}, Cb([](const std::string &s) {
            id(climate_seen) = true;
            id(ha_mode)->execute(s);
            // Wake when it comes on from elsewhere. Not on "off": that's also HA
            // confirming our own press, and the sleep screen should stay put.
            if (s != "off" && s != "unavailable" && s != "unknown") id(wake_screen)->execute();
          }));
          api->subscribe_home_assistant_state(e, std::string("temperature"), Cb([](const std::string &s) {
            if (auto t = parse_number<float>(s)) id(ha_set_temp)->execute(*t);
          }));
          api->subscribe_home_assistant_state(e, std::string("current_temperature"), Cb([](const std::string &s) {
            id(ha_cur_temp)->execute(parse_number<float>(s).value_or(NAN));
          }));
          // What the climate supports, so a press only asks for modes it has
          api->subscribe_home_assistant_state(e, std::string("hvac_modes"), Cb([](const std::string &s) {
            id(hvac_modes) = s;
          }));
          api->subscribe_home_assistant_state(e, std::string("supported_features"), Cb([](const std::string &s) {
            id(climate_features) = parse_number<int>(s).value_or(-1);
          }));
          // Fan speeds for the long-press page
          api->subscribe_home_assistant_state(e, std::string("fan_modes"), Cb([](const std::string &s) {
            // Sent as a Python list: ['auto', 'low', ...]
            std::vector<std::string> modes;
            size_t i = 0;
            while ((i = s.find('\'', i)) != std::string::npos) {
              size_t j = s.find('\'', i + 1);
              if (j == std::string::npos) break;
              modes.push_back(s.substr(i + 1, j - i - 1));
              i = j + 1;
            }
            id(fan_modes) = modes;
          }));
          api->subscribe_home_assistant_state(e, std::string("fan_mode"), Cb([](const std::string &s) {
            id(ha_fan_mode) = s;
          }));
          if (${temp_range_from_ha}) {
            api->subscribe_home_assistant_state(e, std::string("min_temp"), Cb([](const std::string &s) {
              if (auto t = parse_number<float>(s)) if (*t < id(temp_max)) id(temp_min) = *t;
            }));
            api->subscribe_home_assistant_state(e, std::string("max_temp"), Cb([](const std::string &s) {
              if (auto t = parse_number<float>(s)) if (*t > id(temp_min)) id(temp_max) = *t;
            }));
            api->subscribe_home_assistant_state(e, std::string("target_temp_step"), Cb([](const std::string &s) {
              if (auto t = parse_number<float>(s)) if (*t >= 0.1f && *t <= 5) id(temp_step) = *t;
            }));
          }
      - script.execute: build_ui
      # Let LVGL draw the first frame before the backlight comes on
      - delay: 150ms
      - script.execute: wake_screen

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Espressif's LVGL tuning for the S3: optimise for speed and give the caches room
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y

psram:
  mode: octal
  speed: 80MHz

logger:

globals:
  - id: subscribed_entity
    type: std::string
  - id: subscriptions_made
    type: bool
    initial_value: "false"
  # Home Assistant has sent the climate entity's state at least once
  - id: climate_seen
    type: bool
    initial_value: "false"
  - id: linked_since
    type: uint32_t
    initial_value: "0"
  # The climate's hvac_modes attribute as Home Assistant sends it ("['off', 'heat', ...]")
  # and its supported_features (-1 = not known yet)
  - id: hvac_modes
    type: std::string
  - id: climate_features
    type: int
    initial_value: "-1"
  # Mode the next power-on asks for ("" = climate.turn_on)
  - id: power_mode
    type: std::string

text:
  - platform: template
    id: climate_entity
    name: Climate entity
    icon: mdi:thermostat
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${climate_entity}"
    on_value:
      # A different entity needs new subscriptions, which Home Assistant only picks up
      # when it reconnects: restart
      - if:
          condition:
            lambda: return id(subscriptions_made) && x != id(subscribed_entity);
          then:
            - logger.log:
                format: "Climate entity changed to '%s', restarting"
                args: [x.c_str()]
            - delay: 1s
            - lambda: App.safe_reboot();

select:
  - platform: template
    id: power_on_mode
    name: Power on mode
    icon: mdi:power
    entity_category: config
    options: ["Last used", "Heat/Cool", "Auto", "Heat", "Cool"]
    initial_option: "${power_on_mode}"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          static const char *MODES[] = {"", "heat_cool", "auto", "heat", "cool"};
          id(on_mode) = MODES[i];

interval:
  # Linked = Home Assistant is connected and subscribed (log viewers don't count)
  - interval: 1s
    then:
      - lambda: |-
          bool linked = api::global_api_server->is_connected_with_state_subscription();
          if (linked && !id(ha_linked)) id(linked_since) = millis();
          id(ha_linked) = linked;

          // Setup screens: Wi-Fi, then adding to Home Assistant, then choosing a climate entity
          auto *w = wifi::global_wifi_component;
          lcars_setup::Mode mode = lcars_setup::NONE;
          char ip[network::IP_ADDRESS_BUFFER_SIZE] = "";
          if (w->is_connected()) {
            for (auto &a : w->wifi_sta_ip_addresses())
              if (a.is_set() && a.is_ip4()) {
                a.str_to(ip);
                break;
              }
            if (!api::global_api_server->get_noise_ctx().has_psk())
              mode = lcars_setup::HOME_ASSISTANT;
            else if (id(subscribed_entity).empty())
              mode = lcars_setup::CLIMATE;
            else if (linked && !id(climate_seen) && millis() - id(linked_since) > 8000)
              mode = lcars_setup::NOT_FOUND;
          } else if (w->is_ap_active()) {
            mode = lcars_setup::WIFI;
          }
          bool was = lcars_setup::active();
          lcars_setup::show(mode, ip, id(subscribed_entity).c_str());
          if (lcars_setup::active() && !was) id(wake_screen)->execute();

packages:
  ui: !include lcars_climate_ui.yaml

spi:
  id: lcd_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO6
    # 25 kHz avoids the stripe artefacts the vendor saw at lower PWM rates
    frequency: 25000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

display:
  - platform: ili9xxx
    id: lcd
    model: GC9A01A
    spi_id: lcd_spi
    cs_pin: GPIO2
    dc_pin: GPIO3
    reset_pin: GPIO8
    dimensions:
      width: 240
      height: 240
    data_rate: 80MHz
    color_order: bgr
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
    auto_clear_enabled: false
    update_interval: never

sensor:
  - platform: rotary_encoder
    id: knob
    pin_a:
      number: GPIO48
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO47
      mode: INPUT_PULLUP
    # Count every detent
    resolution: 2
    on_clockwise:
      - script.execute: { id: knob_step, direction: 1 }
    on_anticlockwise:
      - script.execute: { id: knob_step, direction: -1 }

binary_sensor:
  # Knob push button: a tap (acted on at release) is on/off, a press and hold opens fan speed
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 25ms
    on_click:
      min_length: 10ms
      max_length: 450ms
      then:
        - script.execute: knob_press
    on_press:
      - script.execute: long_press

script:
  - id: send_temperature
    then:
      - if:
          condition:
            lambda: return id(subscribed_entity).empty();
          then:
            - script.stop: send_temperature
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda return id(subscribed_entity);
            temperature: !lambda return id(set_temp);

  - id: send_power
    then:
      - if:
          condition:
            lambda: return id(subscribed_entity).empty();
          then:
            - script.stop: send_power
      - if:
          condition:
            lambda: return !id(ac_on);
          then:
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: !lambda return id(subscribed_entity);
          else:
            # Pick a mode the climate actually has: the chosen one, else Auto <-> Heat/Cool,
            # else the last mode it was on, else the first one it lists. "Last used" asks
            # the climate to turn itself on if it supports that.
            - lambda: |-
                const std::string &modes = id(hvac_modes);
                auto has = [&](const std::string &m) {
                  return !m.empty() && (modes.empty() || modes.find("'" + m + "'") != std::string::npos);
                };
                const int TURN_ON = 256;
                std::string want = id(on_mode), pick;
                if (want.empty() && id(climate_features) >= 0 && (id(climate_features) & TURN_ON)) {
                  pick = "";
                } else {
                  if (want.empty()) want = id(last_on_mode);
                  if (has(want)) pick = want;
                  else if (want == "auto" && has("heat_cool")) pick = "heat_cool";
                  else if (want == "heat_cool" && has("auto")) pick = "auto";
                  else if (has(id(last_on_mode))) pick = id(last_on_mode);
                  else {
                    pick = want;
                    for (const char *m : {"heat_cool", "auto", "cool", "heat", "dry", "fan_only"})
                      if (has(m)) { pick = m; break; }
                  }
                }
                id(power_mode) = pick;
                if (!pick.empty()) id(hvac_mode) = pick;
                ESP_LOGI("lcars", "Turning on %s in mode '%s' (wanted '%s', supports %s)", id(subscribed_entity).c_str(),
                         pick.empty() ? "(turn_on)" : pick.c_str(), id(on_mode).c_str(), modes.c_str());
            - if:
                condition:
                  lambda: return id(power_mode).empty();
                then:
                  - homeassistant.action:
                      action: climate.turn_on
                      data:
                        entity_id: !lambda return id(subscribed_entity);
                else:
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: !lambda return id(subscribed_entity);
                        hvac_mode: !lambda return id(power_mode);

  - id: long_press
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            binary_sensor.is_on: knob_button
          then:
            - script.execute: fan_open

  - id: send_fan_mode
    then:
      - if:
          condition:
            lambda: return id(subscribed_entity).empty() || id(fan_modes).empty();
          then:
            - script.stop: send_fan_mode
      - lambda: id(ha_fan_mode) = id(fan_modes)[id(fan_index)];
      - homeassistant.action:
          action: climate.set_fan_mode
          data:
            entity_id: !lambda return id(subscribed_entity);
            fan_mode: !lambda return id(fan_modes)[id(fan_index)];

  - id: set_backlight
    parameters:
      level: float
    then:
      - light.turn_on:
          id: backlight
          brightness: !lambda return level;
          transition_length: 1s
